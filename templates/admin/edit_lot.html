{%extends 'layout.html' %}
{% block title %}
EDIT --PARKING
{% endblock %}

{% block content %}
<div class="container mt-5">
  <h1>Edit Parking Lot</h1>
  <form method="post" class="mt-3">
    <label for="name" class="form-label">Lot Name:
      <input type="text" name="lot_name" id="lot_name" class="form-control" value="{{ lot.lot_name }}" required />
    </label>
    <label class="form-label">Postal Code
      <input type="text" name="postal_code" class="form-control" value="{{ lot.postal_code }}" required />
    </label>
    <label for="location" class="form-label">Location:
      <input type="text" name="location" id="location" class="form-control" value="{{ lot.location }}" required />
    </label>
    <label class="form-label">Billing Rate
      <input type="number" name="billing_rate" id="billing_rate" class="form-control" step="0.01" value="{{ lot.billing_rate }}" required />
    </label>
    <label class="form-label">Maximum Spots
      <input type="number" name="maximum_spots" id="maximum_spots" class="form-control" value="{{ lot.maximum_spots }}" required />
    </label>
    <button type="submit" class="btn btn-success">Update Lot</button>
    <a href="{{ url_for('view_lots') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
