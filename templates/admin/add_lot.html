{%extends 'layout.html' %}

{% block title %}
ADD LOT -- PARKING
{% endblock %}

{% block content %}
<div class="container mt-5">
  <h1>Add New Parking Lot</h1>
  <form method="post" class="mt-3"> 
    <label for="name" class="form-label">Lot Name:
      <input type="text" name="lot_name" id="lot_name" class="form-control" required />
    </label>
    <label for="location" class="form-label">Location:
      <input type="text" name="location" id="location" class="form-control" required />
    </label>
    <label class="form-label">Postal Code
      <input type="text" name="postal_code" id="postal_code" class="form-control" required />
    </label>
    <label class="form-label">Billing Rate
      <input type="number" name="billing_rate" class="form-control" step="0.01" required />
    </label>
    <label class="form-label">Maximum Spots
      <input type="number" name="maximum_spots" class="form-control" required />
    </label>
    <button type="submit" class="btn btn-success">Add Lot</button>
    <a href="{{ url_for('view_lots') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
