{% extends 'layout.html' %}
{% block content %}

<h1>Profile
  <small class="text-muted">@{{ user.username }}</small>
</h1>
<hr>
<h4>EDIT PROFILE</h4>
<form method="post" class="mt-2">
  <label for="username" class="form-label">Username:
    <input type="text" name="username" id="username" class="form-control" value="{{ user.username }}" required />
  </label>
  <label for="name" class="form-label">Name:
    <input type="text" name="name" id="name" class="form-control" value="{{ user.name }}" />
  </label>
  <label for="password" class="form-label">Current Password:
    <input type="password" name="cpassword" id="password" class="form-control" required/>
  </label>
  <label for="new_password" class="form-label">New Password:
    <input type="password" name="new_password" id="new_password" class="form-control" required />
  </label>
  <button type="submit" class="btn btn-primary mt-2">Save Changes</button>
  <a href="{{ url_for('logout') }}" class="btn btn-danger text-center mt-2">Logout</a>
</form>
{% endblock %}
{% block style %}
<style>
  form {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1,h2,h3,h4 {
    margin-top: 44px;
    text-align: center;
  }
</style>
{% endblock %}
